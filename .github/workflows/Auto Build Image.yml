name: Auto Build Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

env:
  DOCKER_IMAGE: superng6/xray
  GHCR_IMAGE: ghcr.io/superng6/xray

# Serialize automatic and manual publication so floating tags cannot race.
concurrency:
  group: xray-image-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build_stable: ${{ steps.check-version.outputs.should_build_stable }}
      should_build_pre: ${{ steps.check-version.outputs.should_build_pre }}
      stable_version: ${{ steps.check-version.outputs.stable_version }}
      pre_version: ${{ steps.check-version.outputs.pre_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream releases
        id: check-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/update_release_tag.sh

  build-stable:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_build_stable == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64        # v1
          - linux/amd64/v2     # v2
          - linux/amd64/v3     # v3
          - linux/arm/v7
          - linux/arm64
          - linux/ppc64le
          - linux/s390x
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Platform Name
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push (By Digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          provenance: false
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.stable_version }}
          tags: |-
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests-stable
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests-stable/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-stable-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-stable/*
          retention-days: 1

  build-pre:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_build_pre == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64        # v1
          - linux/amd64/v2     # v2
          - linux/amd64/v3     # v3
          - linux/arm/v7
          - linux/arm64
          - linux/ppc64le
          - linux/s390x
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Platform Name
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push (By Digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          provenance: false
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.pre_version }}
          tags: |-
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests-pre
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests-pre/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-pre-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-pre/*
          retention-days: 1

  merge-stable:
    runs-on: ubuntu-latest
    needs: [prepare, build-stable]
    if: success() && needs.prepare.outputs.should_build_stable == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-stable-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create Manifest List
        working-directory: /tmp/digests
        run: |
          if [ -z "$(ls -A .)" ]; then exit 1; fi
          echo "Creating manifest for: latest, ${{ needs.prepare.outputs.stable_version }}"
          for image in "$DOCKER_IMAGE" "$GHCR_IMAGE"; do
            sources=()
            for digest in *; do
              sources+=("${image}@sha256:${digest}")
            done
            docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:${{ needs.prepare.outputs.stable_version }}" \
              "${sources[@]}"
          done

      - name: Inspect Image
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:latest
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:latest

      - name: Record successfully published version
        env:
          VERSION: ${{ needs.prepare.outputs.stable_version }}
          TAG_FILE: ReleaseTag
        run: bash .github/scripts/record_release_tag.sh
  merge-pre:
    runs-on: ubuntu-latest
    needs: [prepare, build-pre]
    if: success() && needs.prepare.outputs.should_build_pre == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-pre-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create Manifest List
        working-directory: /tmp/digests
        run: |
          if [ -z "$(ls -A .)" ]; then exit 1; fi
          echo "Creating manifest for: dev, ${{ needs.prepare.outputs.pre_version }}"
          for image in "$DOCKER_IMAGE" "$GHCR_IMAGE"; do
            sources=()
            for digest in *; do
              sources+=("${image}@sha256:${digest}")
            done
            docker buildx imagetools create \
              --tag "${image}:dev" \
              --tag "${image}:${{ needs.prepare.outputs.pre_version }}" \
              "${sources[@]}"
          done

      - name: Inspect Image
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:dev
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:dev

      - name: Record successfully published version
        env:
          VERSION: ${{ needs.prepare.outputs.pre_version }}
          TAG_FILE: PreReleaseTag
        run: bash .github/scripts/record_release_tag.sh
