name: Manual Build Docker Image

on:
  # 允许手动触发
  workflow_dispatch:
  # 当 Dockerfile 发生变化时自动触发
  push:
    paths:
      - 'Dockerfile'

env:
  # Docker Hub 镜像名称
  DOCKER_IMAGE: superng6/xray
  # GitHub Container Registry (ghcr.io) 镜像名称
  GHCR_IMAGE: ghcr.io/superng6/xray

jobs:
  # Job 1: 准备阶段 - 直接读取本地文件中的版本号
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: 从文件设置版本号
        id: set-version
        run: |
          # 确保文件存在，防止首次运行报错
          if [ ! -f ReleaseTag ]; then echo "0.0.0" > ReleaseTag; fi
          VERSION=$(cat ReleaseTag | head -n1)
          echo "Current version in file: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  # Job 2: 构建稳定版
  build:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64        # v1 (兼容性最好)
          - linux/amd64/v2     # v2 (兼容 J4125 等)
          - linux/amd64/v3     # v3 (高性能 AVX2)
          - linux/arm/v7
          - linux/arm64
          - linux/ppc64le
          - linux/s390x
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备平台名称 (用于 artifact)
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 构建并推送到双仓库 (按摘要)
        id: build
        uses: docker/build-push-action@v6
        with:
          provenance: false # 使得生成的镜像 manifest 更纯净
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: |-
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: 导出摘要 (digest)
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: 上传摘要为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1
          
  # Job 3: 合并镜像
  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: success()
    permissions:
      contents: read
      packages: write
    steps:
      - name: 登录到双仓库
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 下载所有摘要
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      
      - name: 创建并推送 Manifest List
        working-directory: /tmp/digests
        run: |
          if [ -z "$(ls -A .)" ]; then exit 1; fi
          echo "Creating manifest for: latest, ${{ needs.prepare.outputs.version }}"
          docker buildx imagetools create \
            --tag ${{ env.DOCKER_IMAGE }}:latest \
            --tag ${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.version }} \
            --tag ${{ env.GHCR_IMAGE }}:latest \
            --tag ${{ env.GHCR_IMAGE }}:${{ needs.prepare.outputs.version }} \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)
          
      - name: 检查双仓库的最终镜像
        if: always()
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:latest
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:latest